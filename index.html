<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AMORY | سیستم جامع سالن</title>
    
    <!-- کتابخانه‌ها -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- فایربیس -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #000; color: #eee; overflow-x: hidden; padding-bottom: 20px; }
        .glass { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .btn-gold { background: #D4AF37; color: black; font-weight: bold; padding: 12px; border-radius: 8px; width: 100%; transition: 0.2s; }
        .input-box { background: #222; border: 1px solid #444; color: white; padding: 10px; width: 100%; border-radius: 8px; outline: none; margin-bottom: 10px; text-align: center; }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* استایل انتخاب‌گر تاریخ */
        input[type="date"], input[type="time"] { color-scheme: dark; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. تنظیمات ---
        const firebaseConfig = {
            apiKey: "AIzaSyC0O6xabLpdmh5_dGS-lJc-N_QqQ95_qCU",
            authDomain: "amory-da8ce.firebaseapp.com",
            projectId: "amory-da8ce",
            storageBucket: "amory-da8ce.firebasestorage.app",
            messagingSenderId: "253980572032",
            appId: "1:253980572032:web:2c96ae935b276f05c92965"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_ID = "amory_final_v2"; // ورژن جدید دیتابیس

        const BANK_INFO = { number: "6037997123456789", owner: "سالن زیبایی آموری" };

        const { useState, useEffect } = React;

        // --- کامپوننت اصلی ---
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home');
            const [staffList, setStaffList] = useState([]);
            const [notify, setNotify] = useState(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                auth.onAuthStateChanged(u => setUser(u));
            }, []);

            // همگام‌سازی لیست آرایشگران
            useEffect(() => {
                if(!user) return;
                const staffRef = db.collection('artifacts').doc(APP_ID).collection('staff');
                
                staffRef.onSnapshot(snap => {
                    if(snap.empty) {
                        // ایجاد آرایشگران پیش‌فرض اگر دیتابیس خالی بود
                        const defaults = [
                            { id: 's1', name: 'پیش فرض 1', pin: '1111', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                            { id: 's2', name: 'پیش فرض 2', pin: '2222', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                            { id: 's3', name: 'پیش فرض 3', pin: '3333', img: '', services: [{name:'اصلاح', price:200000}], slots: [] }
                        ];
                        defaults.forEach(s => staffRef.doc(s.id).set(s));
                    } else {
                        setStaffList(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    }
                });
            }, [user]);

            const showNotify = (msg, type='success') => {
                setNotify({msg, type});
                setTimeout(() => setNotify(null), 3000);
            };

            if (!user) return <div className="h-screen flex items-center justify-center"><div className="spinner"></div></div>;

            return (
                <div className="max-w-md mx-auto min-h-screen px-4">
                    <div className="sticky top-0 z-50 bg-black/90 p-4 border-b border-white/10 flex justify-between items-center mb-6 shadow-xl">
                        <h1 className="text-xl font-bold text-[#D4AF37] tracking-widest cursor-pointer" onClick={()=>setView('home')}>AMORY</h1>
                        {view !== 'home' && <button onClick={() => setView('home')} className="text-sm text-zinc-400">خانه</button>}
                    </div>

                    <div>
                        {view === 'home' && <Home setView={setView} />}
                        {view === 'qr' && <QRView />}
                        {view === 'login' && <StaffLogin staffList={staffList} setView={setView} showNotify={showNotify} />}
                        {view === 'admin' && <AdminPanel staffList={staffList} setView={setView} showNotify={showNotify} />}
                        {view === 'panel' && <StaffPanel user={user} setView={setView} showNotify={showNotify} />}
                        {view === 'booking' && <BookingProcess staffList={staffList} setView={setView} showNotify={showNotify} />}
                    </div>

                    {notify && <div className={`fixed bottom-6 left-4 right-4 p-3 rounded-xl text-center shadow-2xl z-50 text-white text-sm font-bold ${notify.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>{notify.msg}</div>}
                </div>
            );
        }

        // --- صفحه اصلی ---
        function Home({ setView }) {
            return (
                <div className="space-y-4">
                    <div className="glass p-6 text-center border border-[#D4AF37]/30"><h2 className="text-xl font-bold mb-2">رزرو آنلاین</h2><p className="text-zinc-400 text-sm">نوبت خود را رزرو کنید</p></div>
                    <button onClick={() => setView('booking')} className="glass w-full p-5 flex justify-between items-center"><span className="font-bold text-lg">رزرو نوبت</span><span className="text-[#D4AF37]">➜</span></button>
                    <button onClick={() => setView('login')} className="glass w-full p-5 flex justify-between items-center"><span className="font-bold text-lg">ورود پرسنل / مدیر</span><span className="text-zinc-500">ورود</span></button>
                    <button onClick={() => setView('qr')} className="text-center w-full text-xs text-zinc-500 mt-4">نمایش QR کد ورود</button>
                </div>
            );
        }

        // --- بخش رزرو مشتری (اصلاح شده: انتخاب از تایم‌های ثبت شده) ---
        function BookingProcess({ staffList, setView, showNotify }) {
            const [step, setStep] = useState(1);
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(false);
            const formatMoney = (n) => new Intl.NumberFormat('fa-IR').format(n);

            const submit = async () => {
                if(!data.name || !data.trackId) return showNotify('اطلاعات ناقص است', 'error');
                setLoading(true);
                try {
                    // ثبت نوبت
                    await db.collection('artifacts').doc(APP_ID).collection('appointments').add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp(), status: 'PAID_PENDING' });
                    
                    // حذف تایم از لیست آرایشگر (چون رزرو شد)
                    const staffRef = db.collection('artifacts').doc(APP_ID).collection('staff').doc(data.staffId);
                    const staffDoc = await staffRef.get();
                    if(staffDoc.exists) {
                        const slots = staffDoc.data().slots || [];
                        const newSlots = slots.filter(s => !(s.date === data.date && s.time === data.time));
                        await staffRef.update({ slots: newSlots });
                    }

                    showNotify('نوبت ثبت شد!'); setTimeout(()=>setView('home'), 2000);
                } catch(e) { showNotify('خطا در ثبت', 'error'); setLoading(false); }
            };

            if(step===1) return <div className="space-y-3"><h3 className="text-[#D4AF37] mb-2 font-bold">۱. انتخاب آرایشگر</h3>{staffList.map(s => (<div key={s.id} onClick={()=>{setData({...data, staffName: s.name, staffId: s.id}); setStep(2)}} className="glass p-3 flex items-center gap-3 cursor-pointer"><img src={s.img || 'https://via.placeholder.com/100?text=Staff'} className="w-12 h-12 rounded-full border border-zinc-600 object-cover"/><div><div className="font-bold">{s.name}</div><div className="text-xs text-zinc-400">نمایش خدمات</div></div></div>))}</div>;
            
            if(step===2) { 
                const s = staffList.find(x=>x.id===data.staffId); 
                return <div className="space-y-3"><div onClick={()=>setStep(1)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><h3 className="text-[#D4AF37] mb-2 font-bold">۲. انتخاب خدمات</h3>
                {(s.services || []).length === 0 ? <p className="text-zinc-500 text-center">خدمتی ثبت نشده</p> : s.services.map((srv, i) => (<div key={i} onClick={()=>{setData({...data, service: srv.name, price: srv.price}); setStep(3)}} className="glass p-4 flex justify-between cursor-pointer"><span>{srv.name}</span><span className="text-[#D4AF37]">{formatMoney(srv.price)} ت</span></div>))}</div>; 
            }

            if(step===3) {
                const s = staffList.find(x=>x.id===data.staffId);
                const availableSlots = s.slots || [];
                return <div className="space-y-4"><div onClick={()=>setStep(2)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><h3 className="text-[#D4AF37] font-bold">۳. انتخاب زمان</h3>
                {availableSlots.length === 0 ? <div className="text-center text-red-400 glass p-4">هیچ نوبت خالی برای این آرایشگر ثبت نشده است.</div> : 
                <div className="grid grid-cols-2 gap-3">{availableSlots.sort((a,b)=>a.date.localeCompare(b.date)).map((slot, i) => (
                    <button key={i} onClick={()=>{setData({...data, date: slot.date, time: slot.time}); setStep(4)}} className="glass p-3 text-center hover:bg-zinc-800"><div className="font-bold">{slot.time}</div><div className="text-xs text-zinc-400">{slot.date}</div></button>
                ))}</div>}</div>;
            }

            if(step===4) return <div className="space-y-4"><div onClick={()=>setStep(3)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><div className="glass p-5 text-center"><p className="text-xs text-zinc-400">مبلغ قابل پرداخت</p><p className="text-2xl font-bold text-[#D4AF37] mb-4">{formatMoney(data.price)} تومان</p><div className="bg-zinc-800 p-3 rounded-lg mb-4 text-sm font-mono select-all border border-zinc-700" onClick={()=>navigator.clipboard.writeText(BANK_INFO.number)}>{BANK_INFO.number}<br/><span className="text-[10px] text-zinc-500 font-sans">{BANK_INFO.owner}</span></div><input placeholder="نام و نام خانوادگی" className="input-box" onChange={e=>setData({...data, name: e.target.value})}/><input placeholder="شماره موبایل" type="tel" className="input-box" onChange={e=>setData({...data, phone: e.target.value})}/><input placeholder="کد پیگیری تراکنش" className="input-box border-[#D4AF37]" onChange={e=>setData({...data, trackId: e.target.value})}/></div><button onClick={submit} disabled={loading} className="btn-gold">{loading ? '...' : 'ثبت نهایی'}</button></div>;
        }

        // --- لاگین (پرسنل + مدیر) ---
        function StaffLogin({ staffList, setView, showNotify }) {
            const [pin, setPin] = useState('');
            const login = () => {
                if(pin === 'admin') { setView('admin'); return; } // رمز ورود به پنل مدیریت کل
                const s = staffList.find(x => x.pin === pin);
                if(s) { localStorage.setItem('staff', JSON.stringify(s)); setView('panel'); } 
                else showNotify('رمز اشتباه است', 'error');
            };
            return (
                <div className="h-[50vh] flex flex-col items-center justify-center gap-4"><h2 className="text-xl font-bold">ورود پرسنل</h2><input type="password" value={pin} onChange={e=>setPin(e.target.value)} className="input-box w-40 text-center text-xl tracking-widest" placeholder="PIN" /><button onClick={login} className="btn-gold w-40">ورود</button></div>
            );
        }

        // --- پنل مدیریت کل (Admin) ---
        function AdminPanel({ staffList, setView, showNotify }) {
            const [newStaffName, setNewStaffName] = useState('');
            const [newStaffPin, setNewStaffPin] = useState('');

            const addStaff = async () => {
                if(!newStaffName || !newStaffPin) return showNotify('نام و پین الزامیست', 'error');
                await db.collection('artifacts').doc(APP_ID).collection('staff').add({
                    name: newStaffName, pin: newStaffPin, services: [], slots: [], img: ''
                });
                showNotify('آرایشگر اضافه شد'); setNewStaffName(''); setNewStaffPin('');
            };

            const deleteStaff = async (id) => {
                if(confirm('آیا مطمئنید؟')) {
                    await db.collection('artifacts').doc(APP_ID).collection('staff').doc(id).delete();
                    showNotify('حذف شد');
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><h2 className="text-xl text-[#D4AF37]">مدیریت سالن</h2><button onClick={()=>setView('home')} className="text-xs text-red-400">خروج</button></div>
                    
                    <div className="glass p-4">
                        <h3 className="text-sm font-bold mb-2">افزودن آرایشگر جدید</h3>
                        <input placeholder="نام آرایشگر" className="input-box" value={newStaffName} onChange={e=>setNewStaffName(e.target.value)} />
                        <input placeholder="رمز ورود (PIN)" className="input-box" value={newStaffPin} onChange={e=>setNewStaffPin(e.target.value)} />
                        <button onClick={addStaff} className="btn-gold text-sm py-2">افزودن</button>
                    </div>

                    <div className="space-y-2">
                        {staffList.map(s => (
                            <div key={s.id} className="glass p-3 flex justify-between items-center">
                                <div><div className="font-bold">{s.name}</div><div className="text-xs text-zinc-500">PIN: {s.pin}</div></div>
                                <button onClick={()=>deleteStaff(s.id)} className="text-red-500 text-xs border border-red-900 p-2 rounded">حذف</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- پنل پرسنل (ویرایش کامل) ---
        function StaffPanel({ user, setView, showNotify }) {
            const initialStaff = JSON.parse(localStorage.getItem('staff'));
            const [staff, setStaff] = useState(initialStaff);
            const [tab, setTab] = useState('appts'); // appts, schedule, profile, services
            const [appts, setAppts] = useState([]);
            
            // State for edits
            const [editName, setEditName] = useState(staff.name);
            const [editPin, setEditPin] = useState(staff.pin);
            const [editImg, setEditImg] = useState(staff.img || '');
            const [newDate, setNewDate] = useState('');
            const [newTime, setNewTime] = useState('');
            const [newSrvName, setNewSrvName] = useState('');
            const [newSrvPrice, setNewSrvPrice] = useState('');

            useEffect(() => {
                // گوش دادن به تغییرات نوبت‌ها
                const unsubAppts = db.collection('artifacts').doc(APP_ID).collection('appointments').where('staffId', '==', staff.id).onSnapshot(snap => setAppts(snap.docs.map(d => d.data()).sort((a,b) => b.createdAt - a.createdAt)));
                // گوش دادن به تغییرات پروفایل خود آرایشگر (برای آپدیت زنده)
                const unsubStaff = db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).onSnapshot(doc => { if(doc.exists) setStaff({id: doc.id, ...doc.data()}); });
                return () => { unsubAppts(); unsubStaff(); };
            }, []);

            const updateProfile = async () => {
                await db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).update({ name: editName, pin: editPin, img: editImg });
                showNotify('پروفایل بروز شد');
            };

            const addSlot = async () => {
                if(!newDate || !newTime) return showNotify('تاریخ و ساعت الزامیست', 'error');
                const currentSlots = staff.slots || [];
                await db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).update({
                    slots: [...currentSlots, {date: newDate, time: newTime}]
                });
                showNotify('تایم اضافه شد');
            };

            const removeSlot = async (idx) => {
                const newSlots = [...staff.slots];
                newSlots.splice(idx, 1);
                await db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).update({ slots: newSlots });
            };

            const addService = async () => {
                if(!newSrvName || !newSrvPrice) return showNotify('نام و قیمت الزامیست', 'error');
                const currentServices = staff.services || [];
                await db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).update({
                    services: [...currentServices, {name: newSrvName, price: parseInt(newSrvPrice)}]
                });
                showNotify('خدمت اضافه شد'); setNewSrvName(''); setNewSrvPrice('');
            };

            const removeService = async (idx) => {
                const newServices = [...staff.services];
                newServices.splice(idx, 1);
                await db.collection('artifacts').doc(APP_ID).collection('staff').doc(staff.id).update({ services: newServices });
            };

            return (
                <div className="space-y-4">
                    <div className="glass p-4 flex justify-between items-center">
                        <div className="font-bold text-[#D4AF37]">{staff.name}</div>
                        <button onClick={()=>setView('home')} className="text-red-400 text-xs">خروج</button>
                    </div>

                    <div className="flex bg-zinc-900 p-1 rounded-lg">
                        {['appts','schedule','services','profile'].map(t => (
                            <button key={t} onClick={()=>setTab(t)} className={`flex-1 py-2 text-xs rounded ${tab===t ? 'bg-[#D4AF37] text-black font-bold' : 'text-zinc-400'}`}>
                                {t==='appts'?'نوبت‌ها':t==='schedule'?'تایم':t==='services'?'خدمات':'پروفایل'}
                            </button>
                        ))}
                    </div>

                    {tab === 'appts' && <div className="space-y-3">
                        {appts.length === 0 ? <p className="text-center text-zinc-600 py-10">نوبتی نیست</p> : appts.map((a, i) => (
                            <div key={i} className="glass p-4 border-r-4 border-r-[#D4AF37]">
                                <div className="flex justify-between font-bold"><span>{a.name}</span><span>{a.time}</span></div>
                                <div className="text-xs text-zinc-400 mt-1">{a.service} - {a.date}</div>
                                <div className="text-xs bg-zinc-800 p-1 rounded mt-2 text-center text-green-400">کد: {a.trackId}</div>
                            </div>
                        ))}
                    </div>}

                    {tab === 'schedule' && <div className="space-y-4">
                        <div className="glass p-4">
                            <h3 className="text-sm font-bold mb-2">ثبت تایم خالی جدید</h3>
                            <input type="date" className="input-box" onChange={e=>setNewDate(e.target.value)} />
                            <input type="time" className="input-box" onChange={e=>setNewTime(e.target.value)} />
                            <button onClick={addSlot} className="btn-gold py-2 text-sm">افزودن تایم</button>
                        </div>
                        <div className="space-y-2">
                            {(staff.slots || []).map((s, i) => (
                                <div key={i} className="glass p-3 flex justify-between items-center">
                                    <span>{s.date} - {s.time}</span>
                                    <button onClick={()=>removeSlot(i)} className="text-red-500 text-xs">حذف</button>
                                </div>
                            ))}
                        </div>
                    </div>}

                    {tab === 'services' && <div className="space-y-4">
                        <div className="glass p-4">
                            <h3 className="text-sm font-bold mb-2">افزودن خدمت</h3>
                            <input placeholder="نام خدمت" className="input-box" value={newSrvName} onChange={e=>setNewSrvName(e.target.value)} />
                            <input type="number" placeholder="قیمت (تومان)" className="input-box" value={newSrvPrice} onChange={e=>setNewSrvPrice(e.target.value)} />
                            <button onClick={addService} className="btn-gold py-2 text-sm">افزودن</button>
                        </div>
                        <div className="space-y-2">
                            {(staff.services || []).map((s, i) => (
                                <div key={i} className="glass p-3 flex justify-between items-center">
                                    <span>{s.name} ({s.price})</span>
                                    <button onClick={()=>removeService(i)} className="text-red-500 text-xs">حذف</button>
                                </div>
                            ))}
                        </div>
                    </div>}

                    {tab === 'profile' && <div className="glass p-4 space-y-3">
                        <h3 className="text-sm font-bold text-center mb-4">ویرایش اطلاعات من</h3>
                        <input placeholder="نام نمایشی" className="input-box" value={editName} onChange={e=>setEditName(e.target.value)} />
                        <input placeholder="رمز عبور (PIN)" className="input-box" value={editPin} onChange={e=>setEditPin(e.target.value)} />
                        <input placeholder="لینک عکس پروفایل" className="input-box" value={editImg} onChange={e=>setEditImg(e.target.value)} />
                        <button onClick={updateProfile} className="btn-gold">ذخیره تغییرات</button>
                    </div>}
                </div>
            );
        }

        function QRView() {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}`;
            return <div className="h-[60vh] flex flex-col items-center justify-center text-center"><div className="bg-white p-3 rounded-xl mb-4"><img src={qrUrl} alt="QR" width="200"/></div><p className="text-xs text-zinc-500">برای ورود اسکن کنید</p></div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
