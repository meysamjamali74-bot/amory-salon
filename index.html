<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AMORY | سیستم جامع سالن</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- فایربیس -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #000; color: #eee; overflow-x: hidden; padding-bottom: 20px; }
        .glass { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .btn-gold { background: #D4AF37; color: black; font-weight: bold; padding: 12px; border-radius: 8px; width: 100%; transition: 0.2s; }
        .input-box { background: #222; border: 1px solid #444; color: white; padding: 10px; width: 100%; border-radius: 8px; outline: none; margin-bottom: 10px; text-align: center; }
        .spinner { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC0O6xabLpdmh5_dGS-lJc-N_QqQ95_qCU",
            authDomain: "amory-da8ce.firebaseapp.com",
            projectId: "amory-da8ce",
            storageBucket: "amory-da8ce.firebasestorage.app",
            messagingSenderId: "253980572032",
            appId: "1:253980572032:web:2c96ae935b276f05c92965"
        };

        const BANK_INFO = { number: "6037997123456789", owner: "سالن زیبایی آموری" };
        const APP_ID = "amory_final_v3";

        let db = null, auth = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) { console.warn("Firebase Init Failed:", e); }

        const { useState, useEffect } = React;

        const useDataManager = () => {
            const [mode, setMode] = useState('loading'); 
            const [data, setData] = useState({ staff: [], appointments: [] });
            const [errorMessage, setErrorMessage] = useState(''); // برای نمایش دلیل خطا
            
            const defaultStaff = [
                { id: 's1', name: 'پیش‌فرض ۱', pin: '1111', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                { id: 's2', name: 'پیش‌فرض ۲', pin: '2222', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                { id: 's3', name: 'پیش‌فرض ۳', pin: '3333', img: '', services: [{name:'اصلاح', price:200000}], slots: [] }
            ];

            useEffect(() => {
                const init = async () => {
                    try {
                        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("اتصال زمان‌بر شد (VPN را چک کنید)")), 5000));
                        await Promise.race([auth.signInAnonymously(), timeout]);
                        
                        setMode('online');
                        setErrorMessage(''); // پاک کردن خطا در صورت موفقیت

                        db.collection('artifacts').doc(APP_ID).collection('staff').onSnapshot(snap => {
                            if(snap.empty) {
                                defaultStaff.forEach(s => db.collection('artifacts').doc(APP_ID).collection('staff').doc(s.id).set(s));
                            } else {
                                setData(prev => ({ ...prev, staff: snap.docs.map(d => ({id:d.id, ...d.data()})) }));
                            }
                        });
                        db.collection('artifacts').doc(APP_ID).collection('appointments').onSnapshot(snap => {
                            setData(prev => ({ ...prev, appointments: snap.docs.map(d => ({id:d.id, ...d.data()})) }));
                        });

                    } catch (e) {
                        console.warn("Switching to Offline Mode:", e);
                        // تشخیص نوع خطا برای نمایش به کاربر
                        let msg = "حالت آفلاین";
                        if (e.code === 'auth/network-request-failed') msg = "آفلاین: مشکل اینترنت یا فیلترشکن";
                        else if (e.code === 'auth/unauthorized-domain') msg = "آفلاین: دامنه در فایربیس مجاز نیست";
                        else if (e.message) msg = `آفلاین: ${e.message}`;
                        
                        setErrorMessage(msg);
                        setMode('offline');
                        
                        const localStaff = JSON.parse(localStorage.getItem('amory_staff')) || defaultStaff;
                        const localAppts = JSON.parse(localStorage.getItem('amory_appts')) || [];
                        setData({ staff: localStaff, appointments: localAppts });
                        if(!localStorage.getItem('amory_staff')) localStorage.setItem('amory_staff', JSON.stringify(defaultStaff));
                    }
                };
                init();
            }, []);

            const actions = {
                addAppointment: async (appt) => {
                    if (mode === 'online') await db.collection('artifacts').doc(APP_ID).collection('appointments').add(appt);
                    else {
                        const newAppts = [...data.appointments, appt];
                        setData(prev => ({ ...prev, appointments: newAppts }));
                        localStorage.setItem('amory_appts', JSON.stringify(newAppts));
                    }
                },
                updateStaff: async (id, newData) => {
                    if (mode === 'online') await db.collection('artifacts').doc(APP_ID).collection('staff').doc(id).update(newData);
                    else {
                        const newStaff = data.staff.map(s => s.id === id ? { ...s, ...newData } : s);
                        setData(prev => ({ ...prev, staff: newStaff }));
                        localStorage.setItem('amory_staff', JSON.stringify(newStaff));
                    }
                },
                addStaff: async (staffMember) => {
                     if (mode === 'online') await db.collection('artifacts').doc(APP_ID).collection('staff').add(staffMember);
                     else {
                        const newStaff = [...data.staff, { ...staffMember, id: 's' + Date.now() }];
                        setData(prev => ({ ...prev, staff: newStaff }));
                        localStorage.setItem('amory_staff', JSON.stringify(newStaff));
                     }
                },
                deleteStaff: async (id) => {
                    if (mode === 'online') await db.collection('artifacts').doc(APP_ID).collection('staff').doc(id).delete();
                    else {
                        const newStaff = data.staff.filter(s => s.id !== id);
                        setData(prev => ({ ...prev, staff: newStaff }));
                        localStorage.setItem('amory_staff', JSON.stringify(newStaff));
                    }
                }
            };

            return { mode, data, actions, errorMessage };
        };

        function App() {
            const { mode, data, actions, errorMessage } = useDataManager();
            const [view, setView] = useState('home');
            const [notify, setNotify] = useState(null);

            const showNotify = (msg, type='success') => {
                setNotify({msg, type});
                setTimeout(() => setNotify(null), 3000);
            };

            if (mode === 'loading') return <div className="h-screen flex items-center justify-center"><div className="spinner"></div></div>;

            return (
                <div className="max-w-md mx-auto min-h-screen px-4 pb-20">
                    <div className="sticky top-0 z-50 bg-black/90 p-4 border-b border-white/10 flex justify-between items-center mb-6 shadow-xl">
                        <div>
                            <h1 className="text-xl font-bold text-[#D4AF37] tracking-widest cursor-pointer" onClick={()=>setView('home')}>AMORY</h1>
                            <div className="text-[10px] text-zinc-500">
                                {mode === 'online' ? <span className="text-green-500">● آنلاین</span> : <span className="text-red-400">○ {errorMessage || 'آفلاین'}</span>}
                            </div>
                        </div>
                        {view !== 'home' && <button onClick={() => setView('home')} className="text-sm text-zinc-400">خانه</button>}
                    </div>

                    <div>
                        {view === 'home' && <Home setView={setView} />}
                        {view === 'qr' && <QRView />}
                        {view === 'login' && <StaffLogin staffList={data.staff} setView={setView} showNotify={showNotify} />}
                        {view === 'admin' && <AdminPanel staffList={data.staff} actions={actions} setView={setView} showNotify={showNotify} />}
                        {view === 'panel' && <StaffPanel appts={data.appointments} actions={actions} setView={setView} showNotify={showNotify} />}
                        {view === 'booking' && <BookingProcess staffList={data.staff} actions={actions} setView={setView} showNotify={showNotify} />}
                    </div>

                    {notify && <div className={`fixed bottom-6 left-4 right-4 p-3 rounded-xl text-center shadow-2xl z-50 text-white text-sm font-bold ${notify.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>{notify.msg}</div>}
                </div>
            );
        }

        // --- صفحات ---
        function Home({ setView }) {
            return (
                <div className="space-y-4">
                    <div className="glass p-6 text-center border border-[#D4AF37]/30"><h2 className="text-xl font-bold mb-2">رزرو آنلاین</h2><p className="text-zinc-400 text-sm">نوبت خود را سریع رزرو کنید</p></div>
                    <button onClick={() => setView('booking')} className="glass w-full p-5 flex justify-between items-center"><span className="font-bold text-lg">رزرو نوبت</span><span className="text-[#D4AF37]">➜</span></button>
                    <button onClick={() => setView('login')} className="glass w-full p-5 flex justify-between items-center"><span className="font-bold text-lg">ورود پرسنل / مدیر</span><span className="text-zinc-500">ورود</span></button>
                    <button onClick={() => setView('qr')} className="text-center w-full text-xs text-zinc-500 mt-4">نمایش QR کد</button>
                </div>
            );
        }

        function BookingProcess({ staffList, actions, setView, showNotify }) {
            const [step, setStep] = useState(1);
            const [bookingData, setBookingData] = useState({});
            const formatMoney = (n) => new Intl.NumberFormat('fa-IR').format(n);

            const submit = async () => {
                if(!bookingData.name || !bookingData.trackId) return showNotify('اطلاعات ناقص است', 'error');
                
                await actions.addAppointment({ 
                    ...bookingData, 
                    createdAt: new Date().toISOString(), 
                    status: 'PAID_PENDING' 
                });
                
                const staff = staffList.find(s => s.id === bookingData.staffId);
                const newSlots = (staff.slots || []).filter(s => !(s.date === bookingData.date && s.time === bookingData.time));
                await actions.updateStaff(staff.id, { slots: newSlots });

                showNotify('نوبت ثبت شد!'); setTimeout(()=>setView('home'), 2000);
            };

            if(step===1) return <div className="space-y-3"><h3 className="text-[#D4AF37] mb-2 font-bold">۱. انتخاب آرایشگر</h3>{staffList.map(s => (<div key={s.id} onClick={()=>{setBookingData({...bookingData, staffName: s.name, staffId: s.id}); setStep(2)}} className="glass p-3 flex items-center gap-3 cursor-pointer"><div className="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center font-bold text-xl text-[#D4AF37]">{s.name[0]}</div><div><div className="font-bold">{s.name}</div><div className="text-xs text-zinc-400">نمایش خدمات</div></div></div>))}</div>;
            
            if(step===2) { 
                const s = staffList.find(x=>x.id===bookingData.staffId); 
                return <div className="space-y-3"><div onClick={()=>setStep(1)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><h3 className="text-[#D4AF37] mb-2 font-bold">۲. انتخاب خدمات</h3>
                {(s.services || []).length === 0 ? <p className="text-zinc-500 text-center">خدمتی ثبت نشده</p> : s.services.map((srv, i) => (<div key={i} onClick={()=>{setBookingData({...bookingData, service: srv.name, price: srv.price}); setStep(3)}} className="glass p-4 flex justify-between cursor-pointer"><span>{srv.name}</span><span className="text-[#D4AF37]">{formatMoney(srv.price)} ت</span></div>))}</div>; 
            }

            if(step===3) {
                const s = staffList.find(x=>x.id===bookingData.staffId);
                const availableSlots = s.slots || [];
                return <div className="space-y-4"><div onClick={()=>setStep(2)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><h3 className="text-[#D4AF37] font-bold">۳. انتخاب زمان</h3>
                {availableSlots.length === 0 ? <div className="text-center text-red-400 glass p-4">هیچ نوبت خالی ثبت نشده است.</div> : 
                <div className="grid grid-cols-2 gap-3">{availableSlots.sort((a,b)=>a.date.localeCompare(b.date)).map((slot, i) => (
                    <button key={i} onClick={()=>{setBookingData({...bookingData, date: slot.date, time: slot.time}); setStep(4)}} className="glass p-3 text-center hover:bg-zinc-800"><div className="font-bold">{slot.time}</div><div className="text-xs text-zinc-400">{slot.date}</div></button>
                ))}</div>}</div>;
            }

            if(step===4) return <div className="space-y-4"><div onClick={()=>setStep(3)} className="text-xs mb-2 cursor-pointer text-zinc-500">بازگشت</div><div className="glass p-5 text-center"><p className="text-xs text-zinc-400">مبلغ قابل پرداخت</p><p className="text-2xl font-bold text-[#D4AF37] mb-4">{formatMoney(bookingData.price)} تومان</p><div className="bg-zinc-800 p-3 rounded-lg mb-4 text-sm font-mono select-all border border-zinc-700" onClick={()=>navigator.clipboard.writeText(BANK_INFO.number)}>{BANK_INFO.number}<br/><span className="text-[10px] text-zinc-500 font-sans">{BANK_INFO.owner}</span></div><input placeholder="نام و نام خانوادگی" className="input-box" onChange={e=>setBookingData({...bookingData, name: e.target.value})}/><input placeholder="شماره موبایل" type="tel" className="input-box" onChange={e=>setBookingData({...bookingData, phone: e.target.value})}/><input placeholder="کد پیگیری تراکنش" className="input-box border-[#D4AF37]" onChange={e=>setBookingData({...bookingData, trackId: e.target.value})}/></div><button onClick={submit} className="btn-gold">ثبت نهایی</button></div>;
        }

        function StaffLogin({ staffList, setView, showNotify }) {
            const [pin, setPin] = useState('');
            const login = () => {
                if(pin === 'admin') { setView('admin'); return; } 
                const s = staffList.find(x => x.pin === pin);
                if(s) { localStorage.setItem('staff', JSON.stringify(s)); setView('panel'); } 
                else showNotify('رمز اشتباه است', 'error');
            };
            return (
                <div className="h-[50vh] flex flex-col items-center justify-center gap-4"><h2 className="text-xl font-bold">ورود پرسنل</h2><input type="password" value={pin} onChange={e=>setPin(e.target.value)} className="input-box w-40 text-center text-xl tracking-widest" placeholder="PIN" /><button onClick={login} className="btn-gold w-40">ورود</button></div>
            );
        }

        function AdminPanel({ staffList, actions, setView, showNotify }) {
            const [newStaffName, setNewStaffName] = useState('');
            const [newStaffPin, setNewStaffPin] = useState('');

            const addStaff = async () => {
                if(!newStaffName || !newStaffPin) return showNotify('نام و پین الزامیست', 'error');
                await actions.addStaff({ name: newStaffName, pin: newStaffPin, services: [], slots: [], img: '' });
                showNotify('آرایشگر اضافه شد'); setNewStaffName(''); setNewStaffPin('');
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center"><h2 className="text-xl text-[#D4AF37]">مدیریت سالن</h2><button onClick={()=>setView('home')} className="text-xs text-red-400">خروج</button></div>
                    <div className="glass p-4"><h3 className="text-sm font-bold mb-2">افزودن آرایشگر جدید</h3><input placeholder="نام" className="input-box" value={newStaffName} onChange={e=>setNewStaffName(e.target.value)} /><input placeholder="PIN" className="input-box" value={newStaffPin} onChange={e=>setNewStaffPin(e.target.value)} /><button onClick={addStaff} className="btn-gold text-sm py-2">افزودن</button></div>
                    <div className="space-y-2">{staffList.map(s => (<div key={s.id} className="glass p-3 flex justify-between items-center"><div><div className="font-bold">{s.name}</div><div className="text-xs text-zinc-500">PIN: {s.pin}</div></div><button onClick={()=>{if(confirm('حذف شود؟')) actions.deleteStaff(s.id)}} className="text-red-500 text-xs border border-red-900 p-2 rounded">حذف</button></div>))}</div>
                </div>
            );
        }

        function StaffPanel({ appts, actions, setView, showNotify }) {
            const initialStaff = JSON.parse(localStorage.getItem('staff'));
            const [staff, setStaff] = useState(initialStaff);
            const [tab, setTab] = useState('appts'); 
            const [newDate, setNewDate] = useState('');
            const [newTime, setNewTime] = useState('');
            const [newSrvName, setNewSrvName] = useState('');
            const [newSrvPrice, setNewSrvPrice] = useState('');

            const myAppts = appts.filter(a => a.staffId === staff.id);

            const updateStaffData = async (newData) => { await actions.updateStaff(staff.id, newData); setStaff({...staff, ...newData}); localStorage.setItem('staff', JSON.stringify({...staff, ...newData})); }
            const addSlot = async () => { if(!newDate || !newTime) return showNotify('الزامیست', 'error'); const slots = [...(staff.slots || []), {date: newDate, time: newTime}]; await updateStaffData({ slots }); showNotify('اضافه شد'); };
            const removeSlot = async (idx) => { const slots = [...(staff.slots || [])]; slots.splice(idx, 1); await updateStaffData({ slots }); };
            const addService = async () => { if(!newSrvName || !newSrvPrice) return showNotify('الزامیست', 'error'); const services = [...(staff.services || []), {name: newSrvName, price: parseInt(newSrvPrice)}]; await updateStaffData({ services }); showNotify('اضافه شد'); setNewSrvName(''); setNewSrvPrice(''); };
            const removeService = async (idx) => { const services = [...(staff.services || [])]; services.splice(idx, 1); await updateStaffData({ services }); };

            return (
                <div className="space-y-4">
                    <div className="glass p-4 flex justify-between items-center"><div className="font-bold text-[#D4AF37]">{staff.name}</div><button onClick={()=>setView('home')} className="text-red-400 text-xs">خروج</button></div>
                    <div className="flex bg-zinc-900 p-1 rounded-lg">{['appts','schedule','services','profile'].map(t => (<button key={t} onClick={()=>setTab(t)} className={`flex-1 py-2 text-xs rounded ${tab===t ? 'bg-[#D4AF37] text-black font-bold' : 'text-zinc-400'}`}>{t==='appts'?'نوبت':t==='schedule'?'تایم':t==='services'?'خدمات':'پروفایل'}</button>))}</div>
                    {tab === 'appts' && <div className="space-y-3">{myAppts.length === 0 ? <p className="text-center text-zinc-600 py-10">نوبتی نیست</p> : myAppts.map((a, i) => (<div key={i} className="glass p-4 border-r-4 border-r-[#D4AF37]"><div className="flex justify-between font-bold"><span>{a.name}</span><span>{a.time}</span></div><div className="text-xs text-zinc-400 mt-1">{a.service} - {a.date}</div><div className="text-xs bg-zinc-800 p-1 rounded mt-2 text-center text-green-400">کد: {a.trackId}</div></div>))}</div>}
                    {tab === 'schedule' && <div className="space-y-4"><div className="glass p-4"><h3 className="text-sm font-bold mb-2">ثبت تایم خالی</h3><input type="date" className="input-box" onChange={e=>setNewDate(e.target.value)} /><input type="time" className="input-box" onChange={e=>setNewTime(e.target.value)} /><button onClick={addSlot} className="btn-gold py-2 text-sm">افزودن تایم</button></div><div className="space-y-2">{(staff.slots || []).map((s, i) => (<div key={i} className="glass p-3 flex justify-between items-center"><span>{s.date} - {s.time}</span><button onClick={()=>removeSlot(i)} className="text-red-500 text-xs">حذف</button></div>))}</div></div>}
                    {tab === 'services' && <div className="space-y-4"><div className="glass p-4"><h3 className="text-sm font-bold mb-2">افزودن خدمت</h3><input placeholder="نام خدمت" className="input-box" value={newSrvName} onChange={e=>setNewSrvName(e.target.value)} /><input type="number" placeholder="قیمت" className="input-box" value={newSrvPrice} onChange={e=>setNewSrvPrice(e.target.value)} /><button onClick={addService} className="btn-gold py-2 text-sm">افزودن</button></div><div className="space-y-2">{(staff.services || []).map((s, i) => (<div key={i} className="glass p-3 flex justify-between items-center"><span>{s.name}</span><button onClick={()=>removeService(i)} className="text-red-500 text-xs">حذف</button></div>))}</div></div>}
                    {tab === 'profile' && <div className="glass p-4 space-y-3"><h3 className="text-sm font-bold text-center mb-4">ویرایش اطلاعات</h3><input placeholder="نام" className="input-box" value={staff.name} onChange={e=>setStaff({...staff, name: e.target.value})} /><input placeholder="PIN" className="input-box" value={staff.pin} onChange={e=>setStaff({...staff, pin: e.target.value})} /><button onClick={()=>updateStaffData({name:staff.name, pin:staff.pin})} className="btn-gold">ذخیره تغییرات</button></div>}
                </div>
            );
        }

        function QRView() {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}`;
            return <div className="h-[60vh] flex flex-col items-center justify-center text-center"><div className="bg-white p-3 rounded-xl mb-4"><img src={qrUrl} alt="QR" width="200"/></div><p className="text-xs text-zinc-500">برای ورود اسکن کنید</p></div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
