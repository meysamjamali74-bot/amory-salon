<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AMORY | سیستم جامع سالن</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: #050505;
            color: #eee; 
            overflow-x: hidden; 
            padding-bottom: 20px;
            background-image: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
        }

        .glass { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); }
        .btn-gold { background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%); color: black; font-weight: bold; padding: 12px; border-radius: 8px; width: 100%; transition: 0.2s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .btn-gold:active { transform: scale(0.97); opacity: 0.9; }
        .input-box { background: rgba(0, 0, 0, 0.6); border: 1px solid #444; color: white; padding: 10px; width: 100%; border-radius: 8px; outline: none; margin-bottom: 10px; text-align: center; direction: ltr; }
        .input-box:focus { border-color: #D4AF37; }
        .spinner { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ساعت دیجیتال */
        .digital-clock { font-family: 'Courier New', monospace; letter-spacing: 2px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. تنظیمات ---
        const firebaseConfig = {
            apiKey: "AIzaSyC0O6xabLpdmh5_dGS-lJc-N_QqQ95_qCU",
            authDomain: "amory-da8ce.firebaseapp.com",
            projectId: "amory-da8ce",
            storageBucket: "amory-da8ce.firebasestorage.app",
            messagingSenderId: "253980572032",
            appId: "1:253980572032:web:2c96ae935b276f05c92965"
        };

        const APP_ID = "amory_final_v6"; // نسخه جدید برای دیتابیس تازه

        // راه‌اندازی با قابلیت آفلاین (Persistence)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            // فعال‌سازی کش آفلاین برای پایداری شبکه
            firebase.firestore().enablePersistence({ synchronizeTabs: true })
                .catch(err => console.log("Persistence Error:", err));
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        // --- توابع کمکی تاریخ و زمان (شمسی) ---
        const toPersianDate = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
        };

        const getTehranTime = () => {
            return new Date().toLocaleTimeString('fa-IR', { timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const getTehranDate = () => {
            return new Date().toLocaleDateString('fa-IR', { timeZone: 'Asia/Tehran', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        };

        // بررسی گذشت زمان (برای حذف تایم‌های سوخته)
        const isExpired = (dateStr, timeStr) => {
            const now = new Date();
            // تبدیل تاریخ شمسی ورودی به میلادی برای مقایسه دقیق نیازمند کتابخانه است
            // برای سادگی و سرعت، فرض بر این است که ورودی‌ها استاندارد ISO (میلادی) ذخیره می‌شوند اما شمسی نمایش داده می‌شوند.
            // اگر ورودی input type="date" باشد، خروجی میلادی است.
            const slotDate = new Date(`${dateStr}T${timeStr}`);
            return slotDate < now;
        };

        // --- کامپوننت ساعت ---
        const Clock = () => {
            const [time, setTime] = useState(getTehranTime());
            const [date, setDate] = useState(getTehranDate());

            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(getTehranTime());
                    setDate(getTehranDate());
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="text-center mb-6 fade-in">
                    <div className="text-4xl font-black text-[#D4AF37] digital-clock">{time}</div>
                    <div className="text-xs text-zinc-400 mt-1">{date}</div>
                </div>
            );
        };

        // --- مدیریت داده ---
        const useDataManager = () => {
            const [loading, setLoading] = useState(true); 
            const [data, setData] = useState({ 
                staff: [], 
                appointments: [], 
                settings: { cardNum: "6037997123456789", cardOwner: "سالن زیبایی آموری" },
                uiConfig: { font: 'font-vazir', color: '#eeeeee', fontSize: '16px' }
            });
            const [connectionStatus, setConnectionStatus] = useState('connecting'); // connecting, online, offline

            const defaultStaff = [
                { id: 's1', name: 'پیش‌فرض ۱', pin: '1111', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                { id: 's2', name: 'پیش‌فرض ۲', pin: '2222', img: '', services: [{name:'اصلاح', price:200000}], slots: [] },
                { id: 's3', name: 'پیش‌فرض ۳', pin: '3333', img: '', services: [{name:'اصلاح', price:200000}], slots: [] }
            ];

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(user => {
                    if (user) {
                        setConnectionStatus('online');
                        setLoading(false);
                    } else {
                        auth.signInAnonymously()
                            .then(() => setConnectionStatus('online'))
                            .catch((e) => {
                                console.error(e);
                                setConnectionStatus('offline'); // اگر نتوانست وصل شود
                                setLoading(false);
                            });
                    }
                });

                // لیسنرهای دیتابیس (حتی در حالت آفلاین هم کار می‌کنند اگر کش باشد)
                const unsubStaff = db.collection('artifacts').doc(APP_ID).collection('staff').onSnapshot(snap => {
                    if(snap && !snap.empty) {
                        setData(prev => ({ ...prev, staff: snap.docs.map(d => ({id:d.id, ...d.data()})) }));
                    } else if (snap && snap.empty && connectionStatus === 'online') {
                        // فقط اگر آنلاین بودیم و خالی بود، دیفالت بساز
                        defaultStaff.forEach(s => db.collection('artifacts').doc(APP_ID).collection('staff').doc(s.id).set(s));
                    }
                }, err => console.log("Staff Sync Error (Offline?):", err));

                const unsubAppts = db.collection('artifacts').doc(APP_ID).collection('appointments').onSnapshot(snap => {
                    if(snap) setData(prev => ({ ...prev, appointments: snap.docs.map(d => ({id:d.id, ...d.data()})) }));
                });

                const unsubConf = db.collection('artifacts').doc(APP_ID).collection('config').onSnapshot(snap => {
